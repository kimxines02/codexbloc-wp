name: Deploy WordPress theme

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build production CSS
        run: |
          npm ci
          npm run build

      - name: Validate FTPS secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_SERVER_DIR" ]; then
            echo "::error::Configure FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, and FTP_SERVER_DIR as repository Actions secrets."
            exit 1
          fi

      - name: Deploy theme over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/src/**
            **/package*.json
            **/tailwind.config.js
            **/composer.*
            **/README.md
            **/*.log
            **/*.map
            **/*.zip
            **/.env*
            **/.DS_Store
            **/Thumbs.db
            **/.vscode/**
            **/.idea/**
            **/.editorconfig
            **/phpcs.xml*
